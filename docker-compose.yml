services:
  dockpit:
    build: .
    image: dockpit:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      DOCKPIT_HOST: 0.0.0.0
      DOCKPIT_PORT: 8989
      # DOCKPIT_SECONDARY_STORAGE_PATH: /host/root/mnt/data
      # DOCKPIT_SECONDARY_STORAGE_LABEL: Data Storage
    volumes:
      # :ro does not restrict Docker API operations. See SECURITY.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID using stat -c %g /var/run/docker.sock; see README.md}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
