<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bannerBg)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Background Ambient Glow Circles -->
  <circle cx="200" cy="180" r="140" fill="#4f46e5" opacity="0.12" filter="blur(60px)" />
  <circle cx="950" cy="140" r="160" fill="#06b6d4" opacity="0.10" filter="blur(70px)" />

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Left Content: Logo + Branding -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon Box -->
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#logoGrad)" filter="url(#cardGlow)" />
    <!-- Docker blocks in logo -->
    <g fill="#ffffff" transform="translate(20, 20)">
      <rect x="18" y="0" width="10" height="8" rx="1.5" />
      <rect x="6" y="10" width="10" height="8" rx="1.5" />
      <rect x="18" y="10" width="10" height="8" rx="1.5" />
      <rect x="30" y="10" width="10" height="8" rx="1.5" />
      <path d="M 0 22 C 0 32, 14 36, 36 36 C 44 36, 48 34, 50 30 C 50 28, 48 24, 46 22 Z" />
      <circle cx="43" cy="28" r="2.5" fill="#06b6d4" />
    </g>

    <!-- Title & Slogan -->
    <text x="110" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">Dockpit</text>
    <rect x="290" y="24" width="62" height="24" rx="12" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
    <text x="321" y="40" font-family="monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">v1.0.0</text>

    <text x="110" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      A fast, beautiful, real-time Docker container cockpit &amp; host monitor
    </text>

    <!-- Key Pills / Badges -->
    <g transform="translate(0, 120)">
      <!-- Pill 1: Zero Dependencies -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="rgba(16,23,38,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <text x="28" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Zero Dependencies</text>
      </g>

      <!-- Pill 2: Normalized CPU -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(16,23,38,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="28" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">0-100% Host CPU</text>
      </g>

      <!-- Pill 3: Secret Stripping -->
      <g transform="translate(355, 0)">
        <rect x="0" y="0" width="170" height="32" rx="16" fill="rgba(16,23,38,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#f43f5e" />
        <text x="28" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Safe Secret Stripping</text>
      </g>

      <!-- Pill 4: Ultra Lightweight -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="rgba(16,23,38,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#fbbf24" />
        <text x="28" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">~15 MB Footprint</text>
      </g>
    </g>
  </g>

  <!-- Right Side Mockup Preview Cards -->
  <g transform="translate(820, 60)" filter="url(#cardGlow)">
    <!-- Mini KPI Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="300" height="65" rx="12" fill="rgba(16,23,38,0.92)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">HOST CPU</text>
      <text x="282" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="end">12 CORES</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">8.4%</text>
      <!-- Mini bar -->
      <rect x="90" y="38" width="190" height="6" rx="3" fill="#1e293b" />
      <rect x="90" y="38" width="45" height="6" rx="3" fill="#fbbf24" />
    </g>

    <!-- Mini KPI Card 2 -->
    <g transform="translate(0, 75)">
      <rect width="300" height="65" rx="12" fill="rgba(16,23,38,0.92)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">HOST RAM</text>
      <text x="282" y="24" font-family="monospace" font-size="10" font-weight="600" fill="#c084fc" text-anchor="end">48 GIB</text>
      <text x="18" y="48" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">31.4 GB</text>
      <!-- Mini bar -->
      <rect x="110" y="38" width="170" height="6" rx="3" fill="#1e293b" />
      <rect x="110" y="38" width="112" height="6" rx="3" fill="#a855f7" />
    </g>

    <!-- Mini Container Row Card -->
    <g transform="translate(0, 150)">
      <rect width="300" height="75" rx="12" fill="rgba(16,23,38,0.92)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <circle cx="24" cy="28" r="4" fill="#10b981" />
      <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">production-gateway</text>
      <text x="36" y="50" font-family="monospace" font-size="10" fill="#64748b">nginx:alpine • :80, :443</text>
      <!-- Tags -->
      <rect x="220" y="20" width="62" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <text x="251" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Healthy</text>
    </g>
  </g>
</svg>

