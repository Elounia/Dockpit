<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dockpitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f4ff" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Square / Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#dockpitBg)" filter="url(#iconGlow)" />
  <rect x="4.5" y="4.5" width="91" height="91" rx="21.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" />

  <!-- Cockpit Radar Ring & Reticle -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.8" stroke-dasharray="4 3" />
  <circle cx="50" cy="50" r="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Docker-style Stack Blocks & Hull -->
  <g fill="url(#whaleGrad)" transform="translate(26, 32)">
    <!-- Top Row of Containers -->
    <rect x="18" y="0" width="10" height="8" rx="1.5" />
    <!-- Middle Row of Containers -->
    <rect x="6" y="10" width="10" height="8" rx="1.5" />
    <rect x="18" y="10" width="10" height="8" rx="1.5" />
    <rect x="30" y="10" width="10" height="8" rx="1.5" />
    <!-- Bottom Hull / Platform Shape -->
    <path d="M 0 22 C 0 32, 14 36, 36 36 C 44 36, 48 34, 50 30 C 50 28, 48 24, 46 22 Z" />
    <!-- Cockpit Target Pointer / Radar Blip -->
    <circle cx="43" cy="28" r="3" fill="#22d3ee" stroke="#ffffff" stroke-width="0.8" />
  </g>
</svg>
