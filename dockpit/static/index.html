<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockpit</title>
<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="app-header shell">
    <h1>Dockpit <span class="muted">/ Overview</span></h1>
    <div class="header-actions">
        <button data-action="diagnostics" id="systemIndicator"><span class="state-dot" id="liveDot"></span><span id="statusText">Connecting…</span></button>
        <button data-action="auto" aria-label="Pause automatic refresh"><i id="toggleIcon" class="fa-solid fa-pause"></i><span id="toggleText">Pause</span></button>
        <button data-action="refresh" aria-label="Refresh measurements"><i class="fa-solid fa-rotate"></i></button>
    </div>
</header>
<main class="shell">
    <div class="status-line"><button id="issuesSummary" data-action="filter" data-value="issues">Waiting for health…</button><button id="dataWarning" data-action="diagnostics" class="hidden"></button></div>
    <div class="host-metrics-grid">
<button class="summary-tile" data-action="card" data-value="cpu"><span class="muted">CPU</span><span class="big-value" id="sysCpu">—</span><span class="thin-bar"><span id="sysCpuBar"></span></span><span class="tile-sub" id="sysCpuCores">—</span></button>
<button class="summary-tile" data-action="card" data-value="memory"><span class="muted">RAM</span><span class="big-value" id="sysRam">—</span><span class="thin-bar"><span id="sysRamBar"></span></span><span class="tile-sub" id="sysRamSub">—</span></button>
<button class="summary-tile" data-action="card" data-value="storage"><span class="muted">Storage</span><span class="big-value" id="sysNvmeStats">—</span><span class="thin-bar"><span id="sysNvmeBar"></span></span><span class="tile-sub" id="storageSub">—</span></button>
<button class="summary-tile" data-action="card" data-value="system"><span class="muted">Containers</span><span class="big-value" id="sysHealth">—</span><span class="thin-bar"><span id="sysHealthBar"></span></span><span class="tile-sub" id="sysUptime">—</span></button>
<button class="summary-tile" data-action="card" data-value="gpu"><span class="muted">GPU</span><span class="big-value" id="sysGpu">—</span><span class="thin-bar"><span id="sysGpuBar"></span></span><span class="tile-sub" id="sysGpuName">—</span></button>
</div>
    <div class="toolbar">
        <input type="search" id="searchInput" aria-label="Search stacks and containers" placeholder="Search stacks and containers…">
        <div class="segmented"><button data-action="filter" data-value="all" id="qf-all" class="qf-btn">All <span id="count-all">0</span></button><button data-action="filter" data-value="issues" id="qf-issues" class="qf-btn">Needs attention</button></div>
        <label class="sort-label">Sort <select id="sortBy"><option value="cpu">Highest CPU</option><option value="mem">Highest RAM</option><option value="containers">Most containers</option><option value="name">Name</option></select></label>
        <details class="filters"><summary>Filters</summary><div class="filter-popover">
<button data-action="filter" data-value="cpu" id="qf-cpu" class="qf-btn">Active CPU (>0.5%)</button>
<button data-action="filter" data-value="mem" id="qf-mem" class="qf-btn">Heavy RAM (>250 MB)</button>
<button data-action="filter" data-value="ports" id="qf-ports" class="qf-btn">With ports</button>
<button data-action="filter" data-value="secondary" id="qf-secondary" class="qf-btn">Secondary storage</button>
<button data-action="filter" data-value="root" id="qf-root" class="qf-btn">Root storage</button>
</div></details>
        <button data-action="organize">Organize stacks</button>
        <button data-action="expand" id="expandAll" aria-label="Expand all stacks" title="Expand all stacks">↕</button>
    </div>
    <section class="history-panel" aria-label="Host resource history">
        <div class="chart-heading"><span>Host activity <span class="chart-legend">CPU <span class="muted">/ RAM</span></span></span><span id="historyStatus" class="muted">Collecting samples…</span></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><svg id="cpuHistory" viewBox="0 0 400 60" aria-label="CPU history" class="w-full h-16"></svg><svg id="memoryHistory" viewBox="0 0 400 60" aria-label="RAM history" class="w-full h-16"></svg></div>
    </section>
    <div class="list-heading"><span>Stacks</span><span>CPU</span><span>RAM</span><span></span></div>
    <div id="stacksContainer"></div>
</main>
    <!-- Details / Logs Modal -->
    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="glass-card bg-slate-900 border border-slate-700 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="modalIcon" class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg shrink-0">
                        <i class="fa-solid fa-info"></i>
                    </div>
                    <div class="min-w-0">
                        <h3 id="modalTitle" class="text-base font-bold text-white truncate">Container Details</h3>
                        <p id="modalSubtitle" class="text-xs text-slate-400 truncate">Container ID &amp; status</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button id="modalActionBtn" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-rotate"></i> Reload
                    </button>
                    <button data-action="close" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="modalContent" class="p-5 overflow-y-auto max-h-[75vh] space-y-4">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
